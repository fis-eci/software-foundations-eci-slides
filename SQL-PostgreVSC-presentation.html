    kbd { font-family: inherit; font-size: 10.5px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); background: rgba(255,255,255,.05); }

      overflow-y: auto; padding: 72px 48px 48px; opacity: 0; visibility: hidden; transition: opacity .4s var(--ease), visibility .4s; }
    #grid.on { opacity: 1; visibility: visible; }
    #grid h2 { font-size: 28px; letter-spacing: -.02em; margin-bottom: 6px; }
    #grid p { color: rgba(235,235,245,.6); font-size: 14px; margin-bottom: 28px; }
    #grid .close { position: fixed; top: 20px; right: 24px; }
    .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
    .thumb { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid var(--line);
      background: #05070d; transition: transform .35s var(--ease), border-color .3s, box-shadow .35s; transform: translateY(12px); opacity: 0; }
    #grid.on .thumb { transform: none; opacity: 1; transition-delay: calc(var(--i) * 30ms); }
    .thumb:hover { transform: translateY(-4px) !important; border-color: var(--a); box-shadow: 0 20px 40px -20px var(--a); }
    .thumb.cur { border-color: var(--a); box-shadow: 0 0 0 2px var(--a); }
    .thumb iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; border: 0; transform-origin: top left; pointer-events: none; }

  </div>
  <div class="note rv" style="padding:14px 18px"><i class="fas fa-brain"></i><p style="font-size:15.5px">En <b>IS-FUNDAMENTOS</b>, VS Code se configura para <b>DESACTIVAR</b> la asistencia automática de IA. El objetivo: aprender a escribir SQL <b>línea a línea</b> con comprensión total de cada instrucción.</p></div>
  <div class="grid fill" style="grid-template-columns:1.4fr 1fr;gap:18px">
    <div class="col" style="gap:10px">
      <span class="card-s rv" style="--c:var(--a2)">3 Reglas Vainilla para MYSD</span>
      <div class="col" data-stagger style="gap:10px">
        <div class="card rule k2"><span class="step-n" style="--c:var(--a2)">1</span><p><b>Sin autocompletado SQL avanzado</b> — Desactivar en la configuración de SQLTools. Cada campo y tabla se escribe a mano, con propósito.</p></div>
        <div class="card rule k2"><span class="step-n" style="--c:var(--a2)">2</span><p><b>Sin asistentes visuales de consultas</b> — Prohibido usar generadores de queries, drag-and-drop o constructores automáticos de JOIN.</p></div>
        <div class="card rule k2"><span class="step-n" style="--c:var(--a2)">3</span><p><b>Ejecución siempre manual y selectiva</b> — Seleccionar la consulta exacta y presionar <span class="kbd">Ctrl+E</span> <span class="kbd">Ctrl+E</span>. Nunca "ejecutar todo".</p></div>
      </div>
    </div>
    <div class="card kbad no rv" style="gap:10px">

      <ul class="list" style="--c:var(--bad);gap:9px">
        <li><i class="fas fa-times-circle"></i><span>GitHub Copilot o Gemini generando el SELECT completo</span></li>
        <li><i class="fas fa-times-circle"></i><span>Botón "Run All" sin revisar las sentencias primero</span></li>
        <li><i class="fas fa-times-circle"></i><span>Asistentes visuales para construir tablas o relaciones</span></li>
        <li><i class="fas fa-times-circle"></i><span>Autocompletado agresivo de nombres de columnas</span></li>
        <li><i class="fas fa-times-circle"></i><span>Copiar y pegar SQL sin entender qué hace cada cláusula</span></li>
        <li><i class="fas fa-times-circle"></i><span>Ejecutar todo el archivo .sql sin selección específica</span></li>
      </ul>

<main class="stage" style="gap:12px">
  <div class="head">
    <span class="kicker rv">Extensiones</span>
    <h1 class="h1 sm" data-split>Instalar <span class="grad">SQLTools + Driver PostgreSQL</span></h1>
  </div>
  <div class="grid g2" data-stagger style="gap:14px">
    <div class="card ext k1">
      <span class="tag">BASE</span>
      <div class="card-h" style="gap:12px"><span class="ic"><i class="fas fa-database"></i></span><div><h3 class="card-t">SQLTools</h3><p class="xs dim">por Matheus Teixeira</p></div></div>
      <p>Gestión de conexiones, escritura y ejecución manual de consultas SQL en VS Code. Base sobre la que se monta el driver de PostgreSQL.</p>
      <ul class="list" style="gap:4px"><li><i class="fas fa-check"></i>Conexiones guardadas y reutilizables por proyecto</li><li><i class="fas fa-check"></i>Editor SQL con resaltado de sintaxis PostgreSQL</li><li><i class="fas fa-check"></i>Panel de resultados integrado (grid + raw)</li><li><i class="fas fa-check"></i>Historial de consultas ejecutadas</li></ul>
    </div>
    <div class="card ext k2">
      <span class="tag" style="--c:var(--a2)">COMPLEMENTO</span>
      <div class="card-h" style="gap:12px"><span class="ic"><i class="fas fa-plug"></i></span><div><h3 class="card-t">SQLTools PostgreSQL/Cockroach Driver</h3><p class="xs dim">extiende SQLTools</p></div></div>
      <p>Habilita la conexión específica con bases de datos PostgreSQL. Sin este driver, SQLTools no reconoce el motor pg.</p>
      <ul class="list" style="gap:4px;--c:var(--a2)"><li><i class="fas fa-check"></i>Protocolo nativo pg_protocol (libpq compatible)</li><li><i class="fas fa-check"></i>Soporte para conexiones SSL/TLS</li><li><i class="fas fa-check"></i>Compatible con PostgreSQL 12–17</li><li><i class="fas fa-check"></i>Exploración de esquemas, tablas y columnas</li></ul>
    </div>
  </div>
  <div class="inst" data-stagger>
    <div><span class="step-n">1</span><span><b>Ctrl+Shift+X</b><br>abre el panel de extensiones</span></div>
    <div><span class="step-n">2</span><span>Busca <b>"SQLTools"</b><br>instala el de <b>Matheus Teixeira</b></span></div>
    <div><span class="step-n">3</span><span>Busca <b>"SQLTools PostgreSQL"</b><br>instala el driver complementario</span></div>
    <div><span class="step-n">4</span><span><b>Recarga VS Code</b><br>cuando lo solicite el sistema</span></div>
  </div>
  <div class="grid" style="grid-template-columns:1.1fr 1fr;gap:14px">
    <div class="code rv"><div class="code-bar"><i class="fas fa-circle-check" style="margin-right:6px;color:var(--ok)"></i>Resultado</div><pre><span class="g">Extensiones instaladas  ✓</span>
SQLTools  v0.29.x   <span class="g">● Activado</span>
SQLTools PostgreSQL/Cockroach Driver  <span class="g">● Activado</span></pre></div>
    <div class="note warn rv" style="padding:12px 16px"><i class="fas fa-triangle-exclamation"></i><p style="font-size:14px">Antes de continuar, aplica la <b>configuración Vainilla para MYSD</b> según la Guía VS Code Vainilla del curso — desactiva el autocompletado SQL avanzado.</p></div>
  </div>
</main>

<div class="top-meta"><span class="chip on"><i class="fas fa-server"></i>Conexión Remota</span></div>
<main class="stage" style="gap:12px">
  <div class="head">
    <span class="kicker rv">Conexión Remota</span>
    <h1 class="h1 sm" data-split>A. Conexión al Servidor <span class="grad">PostgreSQL de la Escuela</span></h1>
  </div>
  <div class="grid fill" style="grid-template-columns:1.1fr 1fr;gap:18px">
    <div class="col" style="gap:12px">
      <table class="table rv">
        <tr><th>Campo</th><th>Valor</th></tr>
        <tr><td>Connection Name</td><td><code>Escuela-Postgre</code> (nombre descriptivo)</td></tr>
        <tr><td>Server / Host</td><td>Dirección proporcionada por el profesor</td></tr>
        <tr><td>Port</td><td><code>5432</code> (estándar PostgreSQL)</td></tr>
        <tr><td>Database</td><td>Nombre de la base de datos asignada</td></tr>
        <tr><td>Username</td><td>Tu usuario de acceso</td></tr>
        <tr><td>Password</td><td>Tu contraseña de acceso</td></tr>
      </table>
      <div class="note warn rv" style="padding:11px 14px;align-items:flex-start"><i class="fas fa-lightbulb"></i><p style="font-size:13.5px"><b>Diferencia clave vs. Oracle:</b> En PostgreSQL <b>NO existe el concepto de SID</b> como en Oracle. La base de datos se identifica directamente por su <b>NOMBRE</b> (campo <code>Database</code>). Cada estudiante trabaja dentro de su propio <b>esquema</b> — no en bases de datos separadas.</p></div>
    </div>
    <div class="col" style="gap:12px">
      <span class="card-s rv">5 Pasos para crear la conexión</span>
      <div class="steps" data-stagger>
        <div class="step"><span class="step-n">1</span><p class="step-t">Ícono de <b>SQLTools</b> en barra lateral → <b>Add New Connection</b></p></div>
        <div class="step"><span class="step-n">2</span><p class="step-t">Seleccionar <b>PostgreSQL</b> en la lista de drivers disponibles</p></div>
        <div class="step"><span class="step-n">3</span><p class="step-t">Completar el formulario con los parámetros de la tabla izquierda</p></div>
        <div class="step"><span class="step-n">4</span><p class="step-t"><b>Test Connection</b> → espera el mensaje "Connected successfully"</p></div>
        <div class="step"><span class="step-n">5</span><p class="step-t"><b>Save Connection</b> — queda guardada para próximas sesiones</p></div>
      </div>
      <div class="code tree rv"><pre><span class="c">// Panel lateral de SQLTools</span>
Connections
└── Escuela-Postgre <span class="g">● connected</span>
    └── schemas
        ├── tu_usuario <span class="a">← tu esquema</span>
        └── public</pre></div>
    </div>
  </div>
  <div class="note rv" style="padding:10px 16px"><i class="fas fa-circle-info"></i><p style="font-size:13.5px">Si la conexión falla, verifica que estés en la <b>red de la Escuela</b> o conectado via <b>VPN institucional</b>. El servidor no es accesible desde redes externas sin VPN. El puerto es siempre <code>5432</code>.</p></div>
</main>
</body>

<main class="stage" style="gap:12px">
  <div class="head">
    <span class="kicker rv">Conexión Local</span>
    <h1 class="h1 sm" data-split>B. Trabajo en Local — <span class="grad">PostgreSQL Instalado en tu Máquina</span></h1>
  </div>
  <div class="grid fill" style="grid-template-columns:1fr 1fr;gap:18px">
    <div class="col" style="gap:10px">
      <span class="card-s rv"><i class="fas fa-hard-drive"></i>&nbsp; Parámetros Locales</span>
      <table class="table rv">
        <tr><th>Campo</th><th>Valor</th></tr>
        <tr><td>Server / Host</td><td><code>localhost</code></td></tr>
        <tr><td>Port</td><td><code>5432</code></td></tr>
        <tr><td>Database</td><td><code>postgres</code> (por defecto)</td></tr>
        <tr><td>Username</td><td><code>postgres</code> (administrador)</td></tr>
        <tr><td>Password</td><td>La que asignaste al instalar</td></tr>
      </table>
      <div class="code rv"><div class="code-bar"><i class="fas fa-terminal" style="margin-right:6px"></i>Verificar que el servicio está activo</div><pre><span class="c"># Windows — buscar en Servicios:</span>
services.msc  →  postgresql-x64-17  <span class="g">estado: En ejecución</span>
<span class="c"># Línea de comandos (psql):</span>
<span class="g">psql</span> -U postgres     <span class="a">← debe mostrar prompt postgres=#</span>
<span class="g">psql</span> -U postgres -l  <span class="a">← lista todas las bases de datos</span></pre></div>
    </div>
    <div class="col" style="gap:10px">
      <span class="card-s rv"><i class="fas fa-download"></i>&nbsp; Instalar PostgreSQL Local</span>
      <div class="steps" data-stagger>
        <div class="step"><span class="step-n">1</span><p class="step-t">Descargar de <b>postgresql.org/download</b> (versión 16 o 17, multiplataforma)</p></div>
        <div class="step"><span class="step-n">2</span><p class="step-t">Ejecutar el instalador → anotar la contraseña del usuario <b>postgres</b> (no la pierdas)</p></div>
        <div class="step"><span class="step-n">3</span><p class="step-t">Verificar el servicio: <b>services.msc</b> → <b>postgresql-x64-XX</b> en estado Running</p></div>
        <div class="step"><span class="step-n">4</span><p class="step-t">Crear la conexión en <b>SQLTools</b> con los parámetros de la tabla izquierda</p></div>
        <div class="step"><span class="step-n">5</span><p class="step-t">Crear tu BD de práctica: <b>CREATE DATABASE mi_proyecto;</b></p></div>
      </div>
      <div class="code rv"><div class="code-bar"><i class="fas fa-circle-check" style="margin-right:6px;color:var(--ok)"></i>Estado esperado en VS Code</div><pre>Connections
└── localhost-Postgre  <span class="g">● connected</span>
    └── databases
        ├── mi_proyecto  <span class="a">← tu base de datos</span>
        └── postgres     <span class="a">← base por defecto</span></pre></div>
      <div class="code" style="opacity:.75"><pre><span class="k">CREATE DATABASE</span> mi_proyecto;
\\c mi_proyecto
<span class="k">CREATE USER</span> estudiante <span class="k">WITH PASSWORD</span> <span class="s">'clave'</span>;</pre></div>
    </div>
  </div>
  <div class="note tip rv" style="padding:10px 16px"><i class="fas fa-flask"></i><p style="font-size:13.5px">La conexión local es tu <b>laboratorio personal</b>. Úsala para practicar sin afectar el servidor compartido de la Escuela. Puedes borrar y recrear tu BD libremente.</p></div>
</main>
</body>
</html>

<div class="top-meta"><span class="chip on"><i class="fas fa-route"></i>Flujo de Trabajo</span></div>
<main class="stage" style="gap:12px">
  <div class="head">
    <span class="kicker rv">Flujo de Trabajo</span>
    <h1 class="h1 sm" data-split>C. Escribir y Ejecutar <span class="grad">Consultas en VS Code</span></h1>
  </div>
  <div class="flow">
    <div class="card fs k1 rv"><span class="card-s">Paso 01</span><div class="card-h" style="gap:8px"><i class="fas fa-folder-open c1"></i><h3 class="card-t">Abre el .sql</h3></div><p>Archivo existente o <code>Ctrl+N</code> → guarda como <code>.sql</code></p><span class="tag">scripts/consulta.sql</span></div>
    <div class="arrow rv-z"><i class="fas fa-chevron-right"></i></div>
    <div class="card fs k2 rv"><span class="card-s">Paso 02</span><div class="card-h" style="gap:8px"><i class="fas fa-keyboard c2"></i><h3 class="card-t">Escribe la consulta</h3></div><p>Sin autocompletado. Línea a línea, con comprensión total de cada cláusula.</p><span class="tag" style="--c:var(--a2)">Filosofía Vainilla</span></div>
    <div class="arrow rv-z"><i class="fas fa-chevron-right"></i></div>
    <div class="card fs kwarn rv"><span class="card-s">Paso 03</span><div class="card-h" style="gap:8px"><i class="fas fa-mouse-pointer cwarn"></i><h3 class="card-t">Selecciona el texto</h3></div><p>Solo la consulta a ejecutar. <b>No selecciones todo el archivo.</b></p><span class="tag" style="--c:var(--warn)">Click + Shift o Ctrl+A parcial</span></div>
    <div class="arrow rv-z"><i class="fas fa-chevron-right"></i></div>
    <div class="card fs k3 rv"><span class="card-s">Paso 04</span><div class="card-h" style="gap:8px"><i class="fas fa-play c3"></i><h3 class="card-t">Ejecuta</h3></div><p><code>Ctrl+E Ctrl+E</code> → Run Selected Query sobre tu conexión activa</p><span class="tag" style="--c:var(--a3)">Ver resultado en panel</span></div>
  </div>
  <div class="note bad rv" style="padding:10px 16px"><i class="fas fa-exclamation-triangle"></i><p style="font-size:14px"><b>⚡ Regla dorada:</b> <b>NUNCA</b> uses <code>ejecutar todo</code> sin revisar línea por línea lo que va a correr en el servidor compartido. Un <code>DELETE</code> o <code>DROP</code> accidental no tiene vuelta atrás.</p></div>
  <div class="grid fill" style="grid-template-columns:1.1fr 1fr;gap:16px">
    <div class="card k1 rv" style="padding:14px 16px;gap:8px">
      <span class="card-s"><i class="fas fa-bolt"></i>&nbsp; Tips de eficiencia en VS Code</span>
      <ul class="list tips" style="gap:6px">
        <li><i class="fas fa-angle-right"></i><span>Usa <code>Ctrl+\`</code> para abrir el terminal integrado mientras tienes el editor SQL abierto</span></li>
        <li><i class="fas fa-angle-right"></i><span>Puedes tener múltiples pestañas <code>.sql</code> abiertas — una por entidad o funcionalidad</span></li>
        <li><i class="fas fa-angle-right"></i><span>Separa consultas con <code>;</code> en el mismo archivo y selecciona solo la que quieres ejecutar</span></li>
        <li><i class="fas fa-angle-right"></i><span><code>F5</code> en VS Code no ejecuta SQL — siempre selecciona + <code>Ctrl+E Ctrl+E</code></span></li>
      </ul>
    </div>
    <div class="card k2 rv" style="padding:14px 16px;gap:8px">
      <span class="card-s"><i class="fas fa-sitemap"></i>&nbsp; Explorar el esquema</span>
      <p style="font-size:13px">En el panel lateral de SQLTools, expande tu conexión para explorar la estructura de la base de datos sin escribir queries:</p>
      <div class="tree">▼ Escuela-Postgre<br>&nbsp;&nbsp;▸ Tablas <span>— disponibles</span><br>&nbsp;&nbsp;▸ Columnas <span>— y sus tipos</span><br>&nbsp;&nbsp;▸ Funciones &nbsp;▸ Vistas &nbsp;▸ Restricciones</div>
      <p style="font-size:12.5px">Esto reemplaza el <b>Object Navigator</b> de Oracle SQL Developer. Puedes hacer clic en tablas para ver sus columnas sin escribir <b>\\d nombre_tabla</b>.</p>
    </div>
  </div>
</main>
</body>
</html>

<main class="stage" style="gap:12px">
  <div class="head">
    <span class="kicker rv">Control de Versiones</span>
    <h1 class="h1 sm" data-split>Versionando tus <span class="grad">Scripts .sql</span> con Git</h1>
  </div>
  <div class="grid fill" style="grid-template-columns:1fr 1fr;gap:16px">
    <div class="col" style="gap:12px">
      <div class="code rv"><div class="code-bar"><i class="fas fa-folder-tree" style="margin-right:6px"></i>Estructura recomendada del proyecto</div><pre>mi-proyecto/
├── src/
│   └── *.java          <span class="c">← código Java del proyecto</span>
├── scripts/
│   ├── esquema.sql     <span class="c">← DDL: CREATE TABLE, ALTER</span>
│   ├── datos.sql       <span class="c">← DML: INSERT, seed data</span>
│   └── consultas.sql   <span class="c">← SELECT y reportes</span>
├── .gitignore          <span class="c">← excluye .class, target/</span>
└── README.md           <span class="c">← descripción del proyecto</span></pre></div>
      <div class="code rv"><div class="code-bar"><i class="fas fa-shield-halved" style="margin-right:6px"></i>.gitignore — plantilla recomendada</div><pre><span class="c"># Compilados Java</span>
*.class  *.jar  target/
<span class="c"># Forzar rastreo de SQL</span>
<span class="g">!*.sql</span>           <span class="c">← los scripts siempre se versionan</span>
<span class="c"># Logs y temporales</span>
*.log  .env  *.tmp</pre></div>
    </div>
    <div class="col" style="gap:12px">
      <div class="card tight kok rv" style="gap:8px"><span class="card-s"><i class="fas fa-circle-check"></i>&nbsp; Commits correctos</span>
        <div class="cm"><code>git commit -m "feat: añade esquema inicial con claves foráneas"</code><code>git commit -m "fix: corrige restricción NOT NULL en tabla cliente"</code><code>git commit -m "feat: agrega datos de prueba para cliente y cuenta"</code></div></div>
      <div class="card tight kbad rv" style="gap:8px"><span class="card-s"><i class="fas fa-circle-xmark"></i>&nbsp; Commits incorrectos</span>
        <div class="cm"><code>git commit -m "cambios sql"</code><code>git commit -m "listo"</code><code>git commit -m "correcciones"</code></div></div>
      <div class="note warn rv" style="padding:10px 14px"><i class="fas fa-key"></i><p style="font-size:14px"><b>Principio:</b> Un <code>commit</code> = un cambio atómico con propósito claro y mensaje descriptivo.</p></div>
      <div class="code rv"><div class="code-bar"><i class="fab fa-git-alt" style="margin-right:6px"></i>Flujo completo por entrega</div><pre><span class="g">git</span> add scripts/esquema.sql   <span class="c"># solo el archivo relevante</span>
<span class="g">git</span> commit -m <span class="s">"feat: CREATE TABLE clientes"</span>
<span class="g">git</span> push origin main          <span class="c"># sube al repositorio</span></pre></div>
    </div>
  </div>
</main>

  </div>
  <div class="grid g2 fill" data-stagger style="gap:14px">
    <div class="card bp kbad"><span class="ic"><i class="fas fa-ban"></i></span><div><h3 class="card-t">NO ejecutes <code>DROP TABLE</code> sin confirmación del equipo</h3><p>El servidor es compartido. Una tabla eliminada afecta a todos los estudiantes.</p></div></div>
    <div class="card bp k1"><span class="ic"><i class="fas fa-broom"></i></span><div><h3 class="card-t">Vacía tus tablas temporales al finalizar</h3><p>Usa <code>TRUNCATE TABLE</code> al terminar cada sesión para liberar espacio.</p></div></div>
    <div class="card bp kwarn"><span class="ic"><i class="fas fa-scissors"></i></span><div><h3 class="card-t">Prefiere <code>TRUNCATE</code> sobre <code>DELETE</code> sin <code>WHERE</code></h3><p>TRUNCATE es más eficiente para limpiar datos de prueba. DELETE sin WHERE es peligroso.</p></div></div>
    <div class="card bp k2"><span class="ic"><i class="fas fa-plug"></i></span><div><h3 class="card-t">Desconéctate al terminar la sesión</h3><p>SQLTools mantiene conexiones activas. Clic derecho → <b>Disconnect</b> desde el panel lateral.</p></div></div>
  </div>

<span class="k">TRUNCATE TABLE</span> cliente <span class="k">CASCADE</span>;
<span class="c">-- Luego: clic derecho sobre la conexión → Disconnect</span></pre></div>

      if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown') { e.preventDefault(); goTo(cur + 1); }
      else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); goTo(cur - 1); }
      else if (k === 'Home') { e.preventDefault(); goTo(0); }
      else if (k === 'End') { e.preventDefault(); goTo(TOTAL - 1); }
      else if (k === 'f' || k === 'F') toggleFs();
      else if (k === 'g' || k === 'G') toggleGrid(true);
    }
    document.addEventListener('keydown', onKey);
    /* Keys pressed while focus is inside a slide iframe */
    frames.forEach(function (f) { f.addEventListener('load', function () {
      try { f.contentWindow.addEventListener('keydown', onKey); } catch (e) {}
    }); });

    /* Swipe on touch screens */
    var sx = null;
    stage.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
    stage.addEventListener('touchend', function (e) {
      if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
      if (Math.abs(dx) > 50) goTo(cur + (dx < 0 ? 1 : -1));
    });

    /* Immersive mode: in fullscreen the bar hides and peeks on mouse move */
    var peekT;
    document.addEventListener('fullscreenchange', function () {
      document.body.classList.toggle('immersive', !!document.fullscreenElement); fit();
    });
    document.addEventListener('mousemove', function (e) {
      if (!document.body.classList.contains('immersive')) return;
      document.body.classList.toggle('peek', e.clientY > window.innerHeight - 90);
      clearTimeout(peekT); peekT = setTimeout(function () { document.body.classList.remove('peek'); }, 2200);
    });

    window.addEventListener('resize', function () { fit(); if (grid.classList.contains('on')) scaleThumbs(); });
    window.addEventListener('hashchange', function () { var h = parseInt(location.hash.slice(1), 10); if (!isNaN(h)) goTo(h - 1); });

    fit();
    var h = parseInt(location.hash.slice(1), 10);
    goTo(isNaN(h) ? 0 : h - 1);
  </script>
</body>
