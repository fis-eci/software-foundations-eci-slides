    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --a: #58a6ff; --red: #e63323; --line: rgba(255,255,255,.1); --ease: cubic-bezier(.2,.75,.1,1); }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; color: #f5f5f7;

      transition: opacity .55s var(--ease), filter .55s var(--ease); }
    .frame.out { opacity: 0; filter: blur(6px); pointer-events: none; }


    #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; z-index: 40;

      background: rgba(12,14,20,.72); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px);

    body.immersive #bar { transform: translateY(100%); opacity: 0; }

    .ctl { display: flex; align-items: center; gap: 6px; padding: 5px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
    .btn { height: 36px; min-width: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 550; color: rgba(245,245,247,.86);
      transition: background .2s, color .2s, transform .2s var(--ease); }
    .btn:hover { background: rgba(255,255,255,.1); color: #fff; }
    .btn:active { transform: scale(.94); }
    .btn:disabled { opacity: .3; cursor: default; background: transparent; }
    .btn svg { width: 16px; height: 16px; }
    .btn:focus-visible, #jump:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
    #count { font-variant-numeric: tabular-nums; font-size: 13px; color: rgba(235,235,245,.7); padding: 0 6px; display: flex; align-items: center; gap: 4px; }
    #jump { width: 34px; height: 26px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: #fff; text-align: center;
      font: inherit; font-weight: 650; -moz-appearance: textfield; }
    #jump::-webkit-outer-spin-button, #jump::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #jump:hover, #jump:focus { border-color: var(--line); background: rgba(255,255,255,.06); }
    .right { display: flex; justify-content: flex-end; gap: 6px; align-items: center; }
    .hint { font-size: 11.5px; color: rgba(235,235,245,.4); margin-right: 6px; white-space: nowrap; }
    kbd { font-family: inherit; font-size: 10.5px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); background: rgba(255,255,255,.05); }

    #grid { position: fixed; inset: 0; z-index: 60; background: rgba(5,7,13,.9); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px);
      overflow-y: auto; padding: 72px 48px 48px; opacity: 0; visibility: hidden; transition: opacity .4s var(--ease), visibility .4s; }
    #grid.on { opacity: 1; visibility: visible; }
    #grid h2 { font-size: 28px; letter-spacing: -.02em; margin-bottom: 6px; }
    #grid p { color: rgba(235,235,245,.6); font-size: 14px; margin-bottom: 28px; }
    #grid .close { position: fixed; top: 20px; right: 24px; }
    .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
    .thumb { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid var(--line);
      background: #05070d; transition: transform .35s var(--ease), border-color .3s, box-shadow .35s; transform: translateY(12px); opacity: 0; }
    #grid.on .thumb { transform: none; opacity: 1; transition-delay: calc(var(--i) * 30ms); }
    .thumb:hover { transform: translateY(-4px) !important; border-color: var(--a); box-shadow: 0 20px 40px -20px var(--a); }
    .thumb.cur { border-color: var(--a); box-shadow: 0 0 0 2px var(--a); }
    .thumb iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; border: 0; transform-origin: top left; pointer-events: none; }
    .thumb span { position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; font-weight: 650; padding: 3px 8px; border-radius: 6px;

  <div class="head">
    <span class="kicker rv">S1: Teoría</span>
    <h1 class="h1" data-split>¿Qué problema resuelve un <span class="grad">CVS</span>?</h1>
  </div>
  <div class="grid fill gap-l" style="grid-template-columns:1.12fr 1fr">
    <div class="col gap-s">
      <h2 class="card-s rv" style="--c:var(--bad);font-size:12.5px;margin-bottom:-4px"><i class="fas fa-exclamation-triangle"></i>&nbsp; Problemas Comunes sin CVS</h2>
      <div class="col" data-stagger="rv-x" style="gap:8px">
        <div class="card tight flat kbad" style="flex-direction:row;align-items:center;gap:14px;padding:10px 16px"><span class="ic sm"><i class="fas fa-history"></i></span><div><h3 class="card-t" style="font-size:16px">Pérdida del Historial</h3><p style="font-size:14px;line-height:1.4">Sin registro estructurado, no se sabe qué cambió, quién lo hizo ni cuándo ocurrió.</p></div></div>
        <div class="card tight flat kbad" style="flex-direction:row;align-items:center;gap:14px;padding:10px 16px"><span class="ic sm"><i class="fas fa-file-signature"></i></span><div><h3 class="card-t" style="font-size:16px">Sobrescritura de Trabajo</h3><p style="font-size:14px;line-height:1.4">Los cambios de una persona pueden borrar accidentalmente el trabajo de otra.</p></div></div>
        <div class="card tight flat kbad" style="flex-direction:row;align-items:center;gap:14px;padding:10px 16px"><span class="ic sm"><i class="fas fa-undo-alt"></i></span><div><h3 class="card-t" style="font-size:16px">Imposibilidad de Deshacer</h3><p style="font-size:14px;line-height:1.4">No existe una forma segura y rápida de volver a un estado anterior tras un error.</p></div></div>
        <div class="card tight flat kbad" style="flex-direction:row;align-items:center;gap:14px;padding:10px 16px"><span class="ic sm"><i class="fas fa-users-slash"></i></span><div><h3 class="card-t" style="font-size:16px">Desorden en la Colaboración</h3><p style="font-size:14px;line-height:1.4">No existe una "versión oficial" clara para coordinarse (<code>final_v1.zip</code>, <code>final_final.zip</code>).</p></div></div>
        <div class="card tight flat kbad" style="flex-direction:row;align-items:center;gap:14px;padding:10px 16px"><span class="ic sm"><i class="fas fa-random"></i></span><div><h3 class="card-t" style="font-size:16px">Falta de Trabajo Paralelo</h3><p style="font-size:14px;line-height:1.4">No se pueden probar ideas nuevas sin afectar el código estable del proyecto.</p></div></div>
      </div>
    </div>
    <div class="col" style="justify-content:center;gap:18px">
      <div class="card hl k1 rv-z" style="padding:28px;gap:14px">
        <span class="card-s">Definición</span>
        <h2 class="card-t" style="font-size:27px">Sistema de Control de Versiones (CVS)</h2>
        <p style="font-size:17px;color:var(--text)">Es un conjunto de principios y métodos que permiten <strong class="c1">registrar</strong>, <strong class="c3">organizar</strong> y <strong class="c2">recuperar</strong> los cambios realizados sobre uno o varios archivos a lo largo del tiempo.</p>
        <div class="tags">
          <span class="tag"><i class="fas fa-save"></i>Registrar</span>
          <span class="tag" style="--c:var(--a3)"><i class="fas fa-folder-tree"></i>Organizar</span>
          <span class="tag" style="--c:var(--a2)"><i class="fas fa-clock"></i>Recuperar</span>
        </div>
      </div>
      <div class="note warn rv"><i class="fas fa-lightbulb"></i><p><strong>Analogía:</strong> Imagina un "punto de guardado" en un videojuego al que puedes volver en cualquier momento si algo sale mal.</p></div>
    </div>
  </div>
</main>

        <ul class="list bul">
          <li><span><strong>Vértices:</strong> Son las versiones (puntos en la historia).</span></li>

        <ul class="list bul">
          <li><span><strong>Tronco (Main):</strong> Eje central y estable del proyecto. Es la "verdad oficial".</span></li>
          <li><span><strong>Ramas:</strong> Líneas paralelas para experimentar sin romper lo estable.</span></li>
        </ul>

<div class="top-meta"><span class="chip on"><i class="fas fa-book-reader"></i>S1 · Teoría</span></div>
<main class="stage" style="gap:18px">
  <div class="head">
    <span class="kicker rv">S1: Teoría</span>
    <h1 class="h1" data-split>Acciones Básicas en el <span class="grad">Repositorio Local</span></h1>
  </div>
  <div class="grid g3 fill" data-stagger style="gap:14px">
    <div class="card act k2"><div class="card-h"><span class="ic sm"><i class="fas fa-folder-plus"></i></span><h3 class="card-t">Crear Repositorio</h3></div><p>Establece el historial inicial. Transforma una carpeta común en un proyecto con control de versiones.</p><div class="cmd">git init</div></div>
    <div class="card act k1"><div class="card-h"><span class="ic sm"><i class="fas fa-save"></i></span><h3 class="card-t">Crear Versiones (Commit)</h3></div><p>Guarda una foto exacta del proyecto en ese instante. Agrega un nuevo vértice al historial.</p><div class="cmd">git commit -m "mensaje"</div></div>
    <div class="card act k3"><div class="card-h"><span class="ic sm"><i class="fas fa-code-branch"></i></span><h3 class="card-t">Crear Ramas</h3></div><p>Abre una línea de desarrollo paralela para trabajar sin afectar el código principal.</p><div class="cmd">git branch nombre-rama</div></div>
    <div class="card act kwarn"><div class="card-h"><span class="ic sm"><i class="fas fa-map-marker-alt"></i></span><h3 class="card-t">Ubicar Versión (Checkout)</h3></div><p>Te mueve a través del historial. Puedes saltar entre ramas o volver a versiones pasadas.</p><div class="cmd">git checkout nombre-rama</div></div>
    <div class="card act k3"><div class="card-h"><span class="ic sm"><i class="fas fa-compress-arrows-alt"></i></span><h3 class="card-t">Fusionar Líneas (Merge)</h3></div><p>Combina dos historias paralelas. Une los cambios de una rama secundaria hacia la principal.</p><div class="cmd">git merge rama-a-unir</div></div>
    <div class="card act kbad"><div class="card-h"><span class="ic sm"><i class="fas fa-undo"></i></span><h3 class="card-t">Revertir Estado</h3></div><p>Deshace cambios o elimina versiones erróneas. Útil para corregir errores graves.</p><div class="cmd">git reset / git revert</div></div>
  </div>
  <div class="note warn rv" style="padding:12px 18px">
    <i class="fas fa-exclamation-triangle"></i>
    <p style="flex:1"><strong>Manejo de Conflictos:</strong> Ocurre cuando dos personas modifican <strong>la misma línea del mismo archivo</strong> de forma diferente. El sistema no sabe con cuál quedarse y pide ayuda manual.</p>
    <code style="color:var(--bad);font-size:14px;white-space:nowrap">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</code>
  </div>
</main>

<main class="stage">
  <div class="head">
    <span class="kicker rv">S3: Herramienta</span>
    <h1 class="h1" data-split>¿Qué es <span class="grad">Git</span>?</h1>
  </div>
  <div class="fill" style="display:grid;grid-template-columns:1fr 90px 1fr;align-items:stretch">
    <div class="card cmp k3 rv-x">
      <span class="ic lg"><i class="fas fa-lightbulb"></i></span>
      <div><div class="card-s">El Concepto (Teoría)</div><h2>CVS</h2></div>
      <p>Es la <strong>idea abstracta</strong> de registrar cambios, crear versiones y gestionar ramas. Es el "qué" queremos lograr (organización, historial).</p>
      <div class="tags mt-auto" style="--c:var(--a3)"><span class="tag">Filosofía</span><span class="tag">Metodología</span><span class="tag">Estrategia</span></div>
    </div>
    <div class="vs rv-z"><b>VS</b></div>
    <div class="card cmp kr rv">
      <span class="ic lg" style="--c2:#f05033"><i class="fab fa-git-alt"></i></span>
      <div><div class="card-s" style="color:#f05033">La Herramienta (Práctica)</div><h2>Git</h2></div>
      <p>Es el <strong>software concreto</strong> que instalas en tu computador para implementar CVS. Es el "cómo" lo logramos mediante comandos en terminal.</p>
      <div class="tags mt-auto" style="--c:#f05033"><span class="tag">Software</span><span class="tag">Comandos</span><span class="tag">Terminal</span></div>
    </div>
  </div>
  <div class="note rv" style="padding:16px 22px">
    <i class="fas fa-network-wired"></i>
    <p style="flex:1"><strong>¿Cómo funciona?</strong> Git trabaja localmente en tu máquina (sin internet) para gestionar tus versiones privadas. Para colaborar, se conecta a plataformas remotas como <strong>GitHub</strong>, que alojan tu código en la nube.</p>
    <div class="flowline"><i class="fas fa-laptop"></i><span class="dash"></span><i class="fas fa-arrow-right" style="font-size:14px"></i><i class="fab fa-github" style="font-size:30px;color:var(--text)"></i></div>
  </div>
</main>

    <h1 class="h1 sm" data-split>Configuración e <span class="grad">Inicio</span></h1>
  </div>
  <div class="col fill" data-stagger style="gap:12px">
    <div class="card cmdrow k3">
      <div class="col" style="gap:7px">
        <div class="card-h" style="gap:12px"><span class="ic sm"><i class="fas fa-user-cog"></i></span><h3 class="card-t">1. Configurar Identidad</h3><span class="tag badge" style="--c:var(--bad)">Obligatorio</span></div>
        <p>Antes de empezar, debes decirle a Git quién eres. Esto es vital para que tus cambios en GitHub aparezcan con tu nombre y foto correctos. Se hace <strong>una sola vez</strong> por computador.</p>
        <div class="param"><code>--global</code> Aplica para todos tus proyectos en este PC</div>
      </div>
      <div class="code"><pre><span class="c"># Configura tu nombre completo real</span>
<span class="p">$</span> <span class="g">git</span> config <span class="a">--global</span> user.name <span class="s">"Andersson David Sánchez Méndez"</span>
<span class="c"># Configura tu correo institucional</span>
<span class="p">$</span> <span class="g">git</span> config <span class="a">--global</span> user.email <span class="s">"andersson.sanchez-m@mail.escuelaing.edu.co"</span></pre></div>
    </div>
    <div class="card cmdrow k2">
      <div class="col" style="gap:7px">
        <div class="card-h" style="gap:12px"><span class="ic sm"><i class="fas fa-folder-plus"></i></span><h3 class="card-t">2. Iniciar Repositorio (Local)</h3><span class="tag badge" style="--c:var(--a2)">Opción A</span></div>
        <p>Úsalo cuando empiezas un proyecto <strong>desde cero</strong> en tu computador y quieres activar el control de versiones en esa carpeta. Crea la carpeta oculta <code>.git</code>.</p>
        <div class="param"><i class="fas fa-info-circle"></i>Nota: Ejecutar dentro de la carpeta del proyecto</div>
      </div>
      <div class="code"><pre><span class="c"># Transforma la carpeta actual en un repositorio Git</span>
<span class="p">$</span> <span class="g">git</span> init</pre></div>
    </div>
    <div class="card cmdrow k1">
      <div class="col" style="gap:7px">
        <div class="card-h" style="gap:12px"><span class="ic sm"><i class="fas fa-clone"></i></span><h3 class="card-t">3. Clonar Repositorio (Remoto)</h3><span class="tag badge">Opción B</span></div>
        <p>Úsalo para descargar un proyecto que <strong>ya existe en GitHub</strong>. Copia todo el historial y configura automáticamente la conexión remota (origin).</p>
        <div class="param"><code>&lt;url&gt;</code> Dirección HTTPS del repositorio en GitHub</div>

    </div>
  </div>

    var prev = document.getElementById('prev'), next = document.getElementById('next');
    var stitle = document.getElementById('stitle');
    var grid = document.getElementById('grid'), thumbs = document.getElementById('thumbs');

    function fit() {
      var r = stage.getBoundingClientRect();
      var pad = document.body.classList.contains('immersive') ? 0 : Math.min(28, r.width * .03);
      var s = Math.min((r.width - pad * 2) / 1280, (r.height - pad * 2) / 720);
      var x = (r.width - 1280 * s) / 2, y = (r.height - 720 * s) / 2;
      frames.forEach(function (f) { f.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + s + ')'; });
    }

    function goTo(n) {
      n = Math.max(0, Math.min(n, TOTAL - 1));
      if (n === cur) return;
      cur = n;
      var back = frames[1 - front], shown = frames[front];
      back.onload = function () {
        back.onload = null;
        back.classList.remove('out'); shown.classList.add('out');
        front = 1 - front;
        setTimeout(function () { if (shown.classList.contains('out')) shown.removeAttribute('srcdoc'); }, 600);
      };
      back.srcdoc = SLIDES[n];
      jump.value = n + 1;
      stitle.textContent = TITLES[n] || '';
      document.title = (TITLES[n] ? TITLES[n] + ' · ' : '') + 'Control de Versiones — MYSD & DOPO';
      prev.disabled = n === 0; next.disabled = n === TOTAL - 1;
      history.replaceState(null, '', '#' + (n + 1));
      document.querySelectorAll('.thumb').forEach(function (t, i) { t.classList.toggle('cur', i === n); });
    }

    function buildGrid() {
      if (thumbs.children.length) return;
      SLIDES.forEach(function (html, i) {
        var t = document.createElement('div');
        t.className = 'thumb'; t.style.setProperty('--i', i); t.tabIndex = 0;
        t.setAttribute('role', 'button'); t.setAttribute('aria-label', 'Ir a la diapositiva ' + (i + 1));
        var f = document.createElement('iframe');
        f.setAttribute('data-static', ''); f.setAttribute('tabindex', '-1'); f.setAttribute('loading', 'lazy');
        f.title = TITLES[i] || ('Diapositiva ' + (i + 1));
        f.srcdoc = html;
        var l = document.createElement('span'); l.textContent = (i + 1) + ' · ' + (TITLES[i] || '');
        t.appendChild(f); t.appendChild(l);
        t.addEventListener('click', function () { toggleGrid(false); goTo(i); });
        t.addEventListener('keydown', function (e) { if (e.key === 'Enter') { toggleGrid(false); goTo(i); } });
        thumbs.appendChild(t);
      });
      scaleThumbs();
    }
    function scaleThumbs() {
      document.querySelectorAll('.thumb').forEach(function (t) {
        t.firstChild.style.transform = 'scale(' + (t.clientWidth / 1280) + ')';
      });
    }
    function toggleGrid(on) {
      if (on === undefined) on = !grid.classList.contains('on');
      if (on) buildGrid();
      grid.classList.toggle('on', on);
      grid.setAttribute('aria-hidden', on ? 'false' : 'true');
      document.querySelectorAll('.thumb').forEach(function (t, i) { t.classList.toggle('cur', i === cur); });
      if (on) { requestAnimationFrame(scaleThumbs); var c = thumbs.children[cur]; if (c) c.scrollIntoView({ block: 'center' }); }
    }

    function toggleFs() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function () {});
      else document.exitFullscreen();
    }

    prev.addEventListener('click', function () { goTo(cur - 1); });
    next.addEventListener('click', function () { goTo(cur + 1); });
    document.getElementById('btn-fs').addEventListener('click', toggleFs);
    document.getElementById('btn-grid').addEventListener('click', function () { toggleGrid(); });
    document.getElementById('grid-close').addEventListener('click', function () { toggleGrid(false); });
    jump.addEventListener('change', function () { var v = parseInt(this.value, 10); if (!isNaN(v)) goTo(v - 1); });
    jump.addEventListener('keydown', function (e) { if (e.key === 'Enter') { this.blur(); } e.stopPropagation(); });

    function onKey(e) {
      if (e.target === jump) return;
      var k = e.key;
      if (grid.classList.contains('on')) { if (k === 'Escape' || k === 'g' || k === 'G') toggleGrid(false); return; }
      if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown') { e.preventDefault(); goTo(cur + 1); }
      else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); goTo(cur - 1); }
      else if (k === 'Home') { e.preventDefault(); goTo(0); }
      else if (k === 'End') { e.preventDefault(); goTo(TOTAL - 1); }
      else if (k === 'f' || k === 'F') toggleFs();
      else if (k === 'g' || k === 'G') toggleGrid(true);
    }
    document.addEventListener('keydown', onKey);
    /* Keys pressed while focus is inside a slide iframe */
    frames.forEach(function (f) { f.addEventListener('load', function () {
      try { f.contentWindow.addEventListener('keydown', onKey); } catch (e) {}
    }); });

    /* Swipe on touch screens */
    var sx = null;
    stage.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
    stage.addEventListener('touchend', function (e) {
      if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
      if (Math.abs(dx) > 50) goTo(cur + (dx < 0 ? 1 : -1));
    });

    /* Immersive mode: in fullscreen the bar hides and peeks on mouse move */
    var peekT;
    document.addEventListener('fullscreenchange', function () {
      document.body.classList.toggle('immersive', !!document.fullscreenElement); fit();
    });
    document.addEventListener('mousemove', function (e) {
      if (!document.body.classList.contains('immersive')) return;
      document.body.classList.toggle('peek', e.clientY > window.innerHeight - 90);
      clearTimeout(peekT); peekT = setTimeout(function () { document.body.classList.remove('peek'); }, 2200);
    });

    window.addEventListener('resize', function () { fit(); if (grid.classList.contains('on')) scaleThumbs(); });
    window.addEventListener('hashchange', function () { var h = parseInt(location.hash.slice(1), 10); if (!isNaN(h)) goTo(h - 1); });

    fit();
    var h = parseInt(location.hash.slice(1), 10);
    goTo(isNaN(h) ? 0 : h - 1);
  </script>
</body>
</html>
