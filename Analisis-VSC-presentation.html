    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    .frame.out { opacity: 0; filter: blur(6px); pointer-events: none; }

      transition: background .2s, color .2s, transform .2s var(--ease); }

    .btn:focus-visible, #jump:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }
    #count { font-variant-numeric: tabular-nums; font-size: 13px; color: rgba(235,235,245,.7); padding: 0 6px; display: flex; align-items: center; gap: 4px; }
    #jump { width: 34px; height: 26px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: #fff; text-align: center;
      font: inherit; font-weight: 650; -moz-appearance: textfield; }
    #jump::-webkit-outer-spin-button, #jump::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #jump:hover, #jump:focus { border-color: var(--line); background: rgba(255,255,255,.06); }
    .right { display: flex; justify-content: flex-end; gap: 6px; align-items: center; }
    .hint { font-size: 11.5px; color: rgba(235,235,245,.4); margin-right: 6px; white-space: nowrap; }
    kbd { font-family: inherit; font-size: 10.5px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); background: rgba(255,255,255,.05); }

    #grid { position: fixed; inset: 0; z-index: 60; background: rgba(5,7,13,.9); -webkit-backdrop-filter: blur(30px); backdrop-filter: blur(30px);
      overflow-y: auto; padding: 72px 48px 48px; opacity: 0; visibility: hidden; transition: opacity .4s var(--ease), visibility .4s; }
    #grid.on { opacity: 1; visibility: visible; }
    #grid h2 { font-size: 28px; letter-spacing: -.02em; margin-bottom: 6px; }
    #grid p { color: rgba(235,235,245,.6); font-size: 14px; margin-bottom: 28px; }
    #grid .close { position: fixed; top: 20px; right: 24px; }
    .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
    .thumb { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid var(--line);
      background: #05070d; transition: transform .35s var(--ease), border-color .3s, box-shadow .35s; transform: translateY(12px); opacity: 0; }
    #grid.on .thumb { transform: none; opacity: 1; transition-delay: calc(var(--i) * 30ms); }
    .thumb:hover { transform: translateY(-4px) !important; border-color: var(--a); box-shadow: 0 20px 40px -20px var(--a); }
    .thumb.cur { border-color: var(--a); box-shadow: 0 0 0 2px var(--a); }
    .thumb iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; border: 0; transform-origin: top left; pointer-events: none; }

    <h1 class="h1 sm" data-split>🔴 PIT con Maven — <span class="grad">Pruebas de Mutación</span></h1>
  </div>
  <div class="grid fill" style="grid-template-columns:1fr 1fr;gap:16px">
    <div class="col" style="gap:9px">
      <div class="code rv"><div class="code-bar">Configurar pom.xml<span class="lang">XML</span></div><pre><span class="p">&lt;</span><span class="t">plugin</span><span class="p">&gt;</span>
  <span class="p">&lt;</span><span class="t">groupId</span><span class="p">&gt;</span>org.pitest<span class="p">&lt;/</span><span class="t">groupId</span><span class="p">&gt;</span>
  <span class="p">&lt;</span><span class="t">artifactId</span><span class="p">&gt;</span>pitest-maven<span class="p">&lt;/</span><span class="t">artifactId</span><span class="p">&gt;</span>
  <span class="p">&lt;</span><span class="t">version</span><span class="p">&gt;</span><span class="n">1.15.0</span><span class="p">&lt;/</span><span class="t">version</span><span class="p">&gt;</span>
  <span class="p">&lt;</span><span class="t">configuration</span><span class="p">&gt;</span>
    <span class="p">&lt;</span><span class="t">targetClasses</span><span class="p">&gt;&lt;</span><span class="t">param</span><span class="p">&gt;</span><span class="s">com.tupackage.*</span><span class="p">&lt;/</span><span class="t">param</span><span class="p">&gt;&lt;/</span><span class="t">targetClasses</span><span class="p">&gt;</span>
    <span class="p">&lt;</span><span class="t">targetTests</span><span class="p">&gt;&lt;</span><span class="t">param</span><span class="p">&gt;</span><span class="s">com.tupackage.*Test</span><span class="p">&lt;/</span><span class="t">param</span><span class="p">&gt;&lt;/</span><span class="t">targetTests</span><span class="p">&gt;</span>
  <span class="p">&lt;/</span><span class="t">configuration</span><span class="p">&gt;</span>
<span class="p">&lt;/</span><span class="t">plugin</span><span class="p">&gt;</span></pre></div>
      <p class="xs dim rv"><i class="fas fa-info-circle"></i> Este bloque va dentro de <code>&lt;build&gt;&lt;plugins&gt;...&lt;/plugins&gt;&lt;/build&gt;</code></p>
      <span class="card-s rv">Flujo de Resolución — PIT</span>
      <div class="steps" data-stagger>
        <div class="step"><span class="step-n">1</span><p class="step-t">Ejecuta <code>mvn pitest:mutationCoverage</code> desde la terminal</p></div>
        <div class="step"><span class="step-n">2</span><p class="step-t">Abre <code>target/pit-reports/index.html</code> en el navegador</p></div>
        <div class="step"><span class="step-n">3</span><p class="step-t">Identifica el mutante <b>Survived</b> más relevante</p></div>
        <div class="step"><span class="step-n">4</span><p class="step-t">Escribe un <code>@Test</code> que falle cuando se aplica esa mutación</p></div>
        <div class="step"><span class="step-n">5</span><p class="step-t">Re-ejecuta PIT → confirma que el mutante aparece como <b>Killed</b></p></div>
      </div>
    </div>
    <div class="col" style="gap:9px">
      <span class="card-s rv">Ejecución e interpretación</span>
      <div class="code rv"><div class="code-bar"><i class="fas fa-terminal" style="margin-right:6px"></i>Terminal — bash</div><pre><span class="g">$</span> mvn pitest:mutationCoverage
<span class="p">[INFO] Scanning for projects...
[INFO] Generated 12 mutations</span>
<span class="p">[INFO]</span> <span class="cok">10 mutations killed (83%)</span>
<span class="p">[INFO]</span> <span class="cok">BUILD SUCCESS</span></pre></div>
      <div class="res rv">
        <div style="border-color:rgba(52,211,153,.4)"><b class="cok">Killed</b>10/12 — pruebas eficaces</div>
        <div style="border-color:rgba(248,113,113,.4)"><b class="cbad">Survived</b>2/12 — pruebas débiles ← acción requerida</div>
      </div>
      <p class="xs rv" style="color:var(--text-2)"><b>Survived:</b> <code>monto &lt;= saldo</code> → <code>monto &lt; saldo</code> (en <code>retirar</code>) ❌ ninguna prueba falló</p>
      <div class="code rv"><pre><span class="a">@Test</span>
<span class="k">public void</span> <span class="f">shouldDejarSaldoEnCeroWhenRetirarTodoElSaldo</span>() {
    cuenta.consignar(<span class="n">100.0</span>);
    cuenta.retirar(<span class="n">100.0</span>);
    assertEquals(<span class="n">0.0</span>, cuenta.getSaldo(), <span class="n">0.01</span>);
}</pre></div>
      <div class="note pause rv mt-auto" style="padding:9px 14px"><i class="fas fa-pause"></i><p style="font-size:13px"><b>⏸️ Cuando veas</b> un mutante Survived, pausa y escribe la prueba que lo mataría.</p></div>
    </div>
  </div>

      if (Math.abs(dx) > 50) goTo(cur + (dx < 0 ? 1 : -1));
    });

    /* Immersive mode: in fullscreen the bar hides and peeks on mouse move */
    var peekT;
    document.addEventListener('fullscreenchange', function () {
      document.body.classList.toggle('immersive', !!document.fullscreenElement); fit();
    });
    document.addEventListener('mousemove', function (e) {
      if (!document.body.classList.contains('immersive')) return;
      document.body.classList.toggle('peek', e.clientY > window.innerHeight - 90);
      clearTimeout(peekT); peekT = setTimeout(function () { document.body.classList.remove('peek'); }, 2200);
    });

    window.addEventListener('resize', function () { fit(); if (grid.classList.contains('on')) scaleThumbs(); });
    window.addEventListener('hashchange', function () { var h = parseInt(location.hash.slice(1), 10); if (!isNaN(h)) goTo(h - 1); });

    fit();
    var h = parseInt(location.hash.slice(1), 10);
    goTo(isNaN(h) ? 0 : h - 1);
  </script>
</body>
</html>
