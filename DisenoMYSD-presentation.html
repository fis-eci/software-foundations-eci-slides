    kbd { font-family: inherit; font-size: 10.5px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); background: rgba(255,255,255,.05); }

      overflow-y: auto; padding: 72px 48px 48px; opacity: 0; visibility: hidden; transition: opacity .4s var(--ease), visibility .4s; }
    #grid.on { opacity: 1; visibility: visible; }
    #grid h2 { font-size: 28px; letter-spacing: -.02em; margin-bottom: 6px; }
    #grid p { color: rgba(235,235,245,.6); font-size: 14px; margin-bottom: 28px; }
    #grid .close { position: fixed; top: 20px; right: 24px; }
    .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
    .thumb { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; cursor: pointer; border: 1px solid var(--line);
      background: #05070d; transition: transform .35s var(--ease), border-color .3s, box-shadow .35s; transform: translateY(12px); opacity: 0; }
    #grid.on .thumb { transform: none; opacity: 1; transition-delay: calc(var(--i) * 30ms); }
    .thumb:hover { transform: translateY(-4px) !important; border-color: var(--a); box-shadow: 0 20px 40px -20px var(--a); }
    .thumb.cur { border-color: var(--a); box-shadow: 0 0 0 2px var(--a); }
    .thumb iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 720px; border: 0; transform-origin: top left; pointer-events: none; }

    <div class="code rv-z"><div class="code-bar">Tablas.sql · Bienes<span class="lang">SQL</span></div><pre><span class="k">CREATE TABLE</span> Bienes(

<span class="k">CREATE TABLE</span> Utilizaciones(

<span class="k">ALTER TABLE</span> Productos <span class="k">ADD CONSTRAINT</span> <span class="f">FK_PRODUCTOS_BIENES</span>

      <div class="card tight k1 rv"><b>Componentes · PC_</b><p class="small">Un paquete PL/SQL por gran concepto con sus operaciones: <code>ad_</code> adicionar, <code>mo_</code> modificar, <code>el_</code> eliminar, <code>co_</code> consultar.</p></div>
      <div class="card tight k3 rv" style="--c:#a78bfa"><b>Actores · PA_</b><p class="small">Un paquete por actor expone solo lo que ese usuario puede hacer y se otorga a su rol.</p></div>
      <div class="code rv"><pre><span class="k">CREATE ROLE</span> GERENTE_VENTAS;
<span class="k">GRANT EXECUTE ON</span> PA_GERENTE_VENTAS
  <span class="k">TO</span> GERENTE_VENTAS;</pre></div>
      <div class="note rv" style="--c:#34d399;padding:11px 16px"><span class="pause-chip repro"><i class="fas fa-play"></i>Reproduce en Astah</span><p style="font-size:14.5px">Modela PC_ y PA_ en <b>Componentes</b> y <b>Actores</b>: cada función del diagrama de casos de uso debe quedar cubierta.</p></div>

  <div class="head"><span class="kicker rv">Ciclo 1 · Consultas</span><h1 class="h1 sm" data-split>De la historia de usuario al <span class="grad">SQL</span></h1></div>
  <div class="note rv" style="--c:#fbbf24;padding:11px 16px"><span class="pause-chip contrast"><i class="fas fa-right-left"></i>Resuelve y contrasta</span><p style="font-size:14.5px">Escribe las dos consultas sobre tu Modelo Mini. Luego revela las soluciones y compara las uniones y los cálculos.</p></div>
  <div class="grid g2 fill" style="gap:16px">
    <div class="code solution rv" data-veil="Operativa · Vendedor"><div class="code-bar">Operativa · información de un servicio<span class="lang">SQL</span></div><pre><span class="k">SELECT</span> s.codigo, b.nombre,
       s.manoDeObra                         <span class="k">AS</span> costoManoDeObra,
       <span class="f">NVL</span>(<span class="f">SUM</span>(u.unidades * p.precioCompra), <span class="n">0</span>) <span class="k">AS</span> costoProductos,
       s.manoDeObra + <span class="f">NVL</span>(<span class="f">SUM</span>(u.unidades * p.precioCompra), <span class="n">0</span>)
                                            <span class="k">AS</span> costoTotal,
       b.precioVenta,
       b.precioVenta - s.manoDeObra
         - <span class="f">NVL</span>(<span class="f">SUM</span>(u.unidades * p.precioCompra), <span class="n">0</span>) <span class="k">AS</span> utilidad
<span class="k">FROM</span> Servicios s
  <span class="k">JOIN</span> Bienes b <span class="k">ON</span> b.codigo = s.codigo
  <span class="k">LEFT JOIN</span> Utilizaciones u <span class="k">ON</span> u.servicio = s.codigo
  <span class="k">LEFT JOIN</span> Productos p <span class="k">ON</span> p.codigo = u.producto
<span class="k">WHERE</span> s.codigo = <span class="s">'CSERVICIO'</span>
<span class="k">GROUP BY</span> s.codigo, b.nombre, s.manoDeObra, b.precioVenta;</pre></div>
    <div class="code solution rv" data-veil="Gerencial · Gerente de ventas"><div class="code-bar">Gerencial · detalle de todos los bienes<span class="lang">SQL</span></div><pre><span class="k">SELECT</span> b.codigo, b.nombre, b.precioVenta,
       <span class="f">NVL</span>(p.precioCompra, sv.costo) <span class="k">AS</span> precioCompra,
       b.precioVenta - <span class="f">NVL</span>(p.precioCompra, sv.costo) <span class="k">AS</span> utilidad
<span class="k">FROM</span> Bienes b
  <span class="k">LEFT JOIN</span> Productos p <span class="k">ON</span> p.codigo = b.codigo
  <span class="k">LEFT JOIN</span> (<span class="k">SELECT</span> s.codigo,
                    s.manoDeObra + <span class="f">NVL</span>(<span class="f">SUM</span>(u.unidades * pr.precioCompra), <span class="n">0</span>)
                      <span class="k">AS</span> costo
             <span class="k">FROM</span> Servicios s
               <span class="k">LEFT JOIN</span> Utilizaciones u <span class="k">ON</span> u.servicio = s.codigo
               <span class="k">LEFT JOIN</span> Productos pr <span class="k">ON</span> pr.codigo = u.producto
             <span class="k">GROUP BY</span> s.codigo, s.manoDeObra) sv
    <span class="k">ON</span> sv.codigo = b.codigo
<span class="k">ORDER BY</span> utilidad <span class="k">DESC</span>;</pre></div>
